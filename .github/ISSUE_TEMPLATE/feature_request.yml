name: Feature request
description: Propose a command, flag, or behavior
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The task, not the proposed solution.
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: How do you do it today?
      description: What does the current workaround cost — in commands, or in output bytes?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: >
        Sketch the output too. vv's cost function is output bytes — a proposal
        that makes output larger should say what that buys.
